name: Cleanup GHCR Images

# Prunes ghcr.io/hpcbio/dada2-rs. An image is one build (a digest); a tag is a
# name pointing at one, and a build can carry several (0.5.0 and 0.5). Tagged
# images (releases, latest, main and their -opt twins) are never deleted. Each
# push to main moves :main to the new build and leaves the previous one
# untagged; those untagged builds are all this workflow removes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: list what would be deleted, delete nothing'
        required: true
        default: true
        type: boolean
      keep_n_untagged:
        description: 'Untagged builds to keep, newest first (superseded main builds, kept for rollback; 0 deletes all). Tagged images are always kept.'
        required: true
        default: '5'
        type: string

jobs:
  cleanup:
    name: Cleanup old images
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Run GHCR cleanup
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          dry-run: ${{ inputs.dry_run }}
          keep-n-untagged: ${{ inputs.keep_n_untagged }}
          token: ${{ secrets.GITHUB_TOKEN }}
